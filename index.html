<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jim | Data Analyst</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial;
    }

    body{
      background:#0f172a;
      color:white;
    }

    .hero{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      background:linear-gradient(to right,#0f172a,#1e293b);
    }

    .hero h1{
      font-size:60px;
    }

    .hero p{
      margin-top:10px;
      color:#94a3b8;
      font-size:20px;
    }

    .btn{
      margin-top:20px;
      padding:12px 25px;
      border:none;
      border-radius:5px;
      background:#38bdf8;
      cursor:pointer;
      font-weight:bold;
    }

    .projects{
      padding:60px 20px;
      text-align:center;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
      margin-top:30px;
    }

    .card{
      background:#1e293b;
      padding:30px;
      border-radius:10px;
    }
  </style>
</head>

<body>

<section class="hero">
  <div>
    <h1>Hi, I'm Jim Joseph</h1>
    <p>Data Analyst | BI & Financial Analysis</p>
  <a href="#projects">
  <button class="btn">View Projects</button>
</a>
  </div>
</section>

<section class="projects" id="projects">
  <h2>My Projects</h2>

 <a href="https://github.com/yourusername" target="_blank">
  <div class="card">Sales Dashboard</div>
</a>
    <div class="card">Sales Dashboard</div>
    <div class="card">Customer Analysis</div>
    <div class="card">SQL Data Cleaning</div>
    <div class="card">python</div>
  </div>
</section>

</body>
</html>
